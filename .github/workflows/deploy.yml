name: Build and Deploy Seka Portfolio
on:
  push:
    branches: [main]
jobs:
  test-build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install client
        working-directory: client
        run: npm install
      - name: Install server
        working-directory: server
        run: npm install
      - name: Lint client
        working-directory: client
        run: npm run lint
      - name: Lint server
        working-directory: server
        run: npm run lint
      - name: Build client
        working-directory: client
        run: npm run build
      - name: Docker login
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build, tag and push images
        run: |
          docker compose build
          docker tag seka-portfolio-client ${{ secrets.DOCKERHUB_USERNAME }}/seka-portfolio-client:latest
          docker tag seka-portfolio-server ${{ secrets.DOCKERHUB_USERNAME }}/seka-portfolio-server:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/seka-portfolio-client:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/seka-portfolio-server:latest
  deploy:
    needs: test-build-push
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_USER }}
          key: ${{ secrets.PRODUCTION_SSH_KEY }}
          script: |
            cd /opt/seka-portfolio
            docker compose pull
            docker compose up -d --remove-orphans
