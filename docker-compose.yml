services:
  mongo:
    image: mongo:7.0
    container_name: seka-portfolio-mongo
    restart: unless-stopped
    ports: ["27017:27017"]
    volumes: [mongo_data:/data/db]
    networks: [seka_net]
  server:
    build: { context: ., dockerfile: Dockerfile.server }
    container_name: seka-portfolio-server
    restart: unless-stopped
    env_file: [./server/.env]
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/seka_portfolio
      CORS_ORIGIN: http://localhost
    ports: ["5000:5000"]
    depends_on: [mongo]
    networks: [seka_net]
  client:
    build:
      context: .
      dockerfile: Dockerfile.client
      args: { VITE_API_BASE_URL: /api }
    container_name: seka-portfolio-client
    restart: unless-stopped
    ports: ["80:80"]
    depends_on: [server]
    networks: [seka_net]
volumes: { mongo_data: {} }
networks: { seka_net: { driver: bridge } }
